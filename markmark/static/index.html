<html lang="id">
<head>

<style>
@font-face{font-family:"Fredoka";font-weight:500;font-display:swap;src:url(/static/fonts/fredoka-latin-500.woff2) format("woff2")}
@font-face{font-family:"Fredoka";font-weight:600;font-display:swap;src:url(/static/fonts/fredoka-latin-600.woff2) format("woff2")}

:root{--bg:#f6ecf0;--panel:#fff8f6;--soft:#fbe3df;--ink:#2b2230;--mute:#655a68;--line:#e8d6da;--brand:#b3261e;--pink:#ffe0da;--ok:#1f6b3c;--warn:#8a5200;--hl:#ffe69a;
--head:"Fredoka",system-ui,sans-serif;--body:"Plus Jakarta Sans",system-ui,sans-serif;--mono:"JetBrains Mono",Consolas,monospace;
--clay:14px 14px 30px rgba(140,90,105,.20),inset -7px -7px 14px rgba(170,110,125,.13),inset 7px 7px 14px rgba(255,255,255,.85);
--clay-sm:7px 7px 15px rgba(140,90,105,.20),inset -4px -4px 8px rgba(170,110,125,.14),inset 4px 4px 8px rgba(255,255,255,.8);
--clay-red:8px 8px 18px rgba(179,38,30,.32),inset -5px -5px 10px rgba(90,10,5,.28),inset 5px 5px 10px rgba(255,190,180,.5);
--press:inset 5px 5px 10px rgba(140,90,105,.22),inset -4px -4px 8px rgba(255,255,255,.75)}
@media (prefers-color-scheme:dark){:root{--bg:#231d29;--panel:#312938;--soft:#3b3142;--ink:#f4edf2;--mute:#bbaebd;--line:#4a3f52;--brand:#ff9a90;--pink:#4c2b30;--ok:#7fd6a0;--warn:#f0c070;--hl:#6b5414;
--clay:12px 12px 26px rgba(0,0,0,.42),inset -6px -6px 12px rgba(0,0,0,.25),inset 6px 6px 12px rgba(255,255,255,.07);
--clay-sm:6px 6px 13px rgba(0,0,0,.4),inset -3px -3px 7px rgba(0,0,0,.25),inset 3px 3px 7px rgba(255,255,255,.08);
--clay-red:7px 7px 16px rgba(0,0,0,.45),inset -4px -4px 9px rgba(120,30,25,.4),inset 4px 4px 9px rgba(255,255,255,.35);
--press:inset 5px 5px 10px rgba(0,0,0,.35),inset -3px -3px 7px rgba(255,255,255,.06)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--body)}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;margin:12px auto;max-width:1140px;background:var(--panel);border-radius:26px;box-shadow:var(--clay-sm)}
header b{display:flex;align-items:center;gap:8px;font:600 23px var(--head);color:var(--brand);cursor:pointer}header b svg{width:30px;height:30px}
header span{color:var(--mute);flex:1}
main{max-width:1180px;margin:0 auto;padding:20px}
h2,h3{font-family:var(--head);font-weight:600}h2{font-size:24px;margin:0 0 12px}h3{font-size:18px;margin:0 0 8px}
.panel{background:var(--panel);border-radius:30px;padding:22px;margin-bottom:16px;box-shadow:var(--clay)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:800px){.split{grid-template-columns:1fr}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>.grow{flex:1;min-width:140px}
button{font:inherit;font-weight:600;padding:8px 15px;border:0;border-radius:15px;background:var(--panel);color:var(--ink);cursor:pointer;box-shadow:var(--clay-sm);transition:transform .12s}
button:not(:disabled):hover{transform:translateY(-1px)}button:active{transform:translateY(1px)}
button.main{background:var(--brand);color:var(--panel);box-shadow:var(--clay-red)}button:disabled{opacity:.45;cursor:not-allowed}
button.link{background:none;padding:2px 4px;color:var(--mute);box-shadow:none}
input,select,textarea{font:inherit;padding:9px 12px;border:0;border-radius:14px;background:var(--soft);color:var(--ink);width:100%;box-shadow:var(--press)}
input[type=checkbox]{width:auto;box-shadow:none}textarea{min-height:110px}
label{display:block;margin-bottom:8px;color:var(--mute);font-size:13px}label.check{display:flex;gap:6px;color:var(--ink);font-size:15px}
ul.plain{list-style:none;margin:0;padding:0}ul.plain li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0}
.clickable{cursor:pointer;background:none;padding:0;text-align:left;color:var(--ink);text-decoration:underline;font-weight:600;box-shadow:none}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 6px}th{color:var(--mute);font-size:13px;font-weight:500}tr:nth-child(even) td{background:var(--soft)}
.muted{color:var(--mute)}.warn{color:var(--warn)}.good{color:var(--ok)}.bad{color:var(--brand)}
pre,code{font-family:var(--mono)}pre{white-space:pre-wrap;word-break:break-word;margin:0;font-size:13px;line-height:1.5;max-height:75vh;overflow:auto}
mark{background:var(--hl);color:inherit}
.finding{background:var(--pink);border-radius:22px;padding:14px;margin-bottom:10px;box-shadow:var(--clay-sm)}.finding.done{opacity:.75}
.tag{font-size:12px;color:var(--mute);margin-right:8px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:16px;display:none;max-width:90vw}
</style>
</head>
<body>
<header><b onclick="go('home')"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M49 7H13a6 6 0 0 0-6 6v38a6 6 0 0 0 6 6h38a6 6 0 0 0 6-6V23"/><path d="M18 21v25M45 35v11M26 28l7 7 24-24"/></svg>Markmark</b><span id="tagline"></span>

<script>
const T={id:{tagline:"Temukan kesalahan lebih cepat. Nilai tetap di tangan Anda.",simulation:"Simulasi",simText:"Mode simulasi: semua data fiktif, AI disimulasikan, dan data asli Anda tidak tersentuh. Coba Minggu 1 untuk meninjau, Minggu 2 untuk koreksi, dan Minggu 3 untuk membuat kunci dengan AI.",simReset:"Mulai ulang simulasi",simulation_off:"Simulasi tidak aktif",settings:"Pengaturan",classes:"Kelas",subjects:"Mata pelajaran",newClass:"Nama kelas baru",newSubject:"Nama mata pelajaran baru",add:"Tambah",students:"murid",studentList:"Daftar murid",studentHint:"Satu murid per baris: nomor, nama",linked:"Kelas yang mengikuti",weeks:"Minggu",addWeek:"Tambah minggu",week:"Minggu",back:"Kembali",del:"Hapus",confirmDel:"Hapus? Data di dalamnya ikut terhapus.",pickClass:"Kelas",module:"Modul",key:"Kunci jawaban",answers:"Jawaban siswa",noModule:"Belum ada modul",uploadModule:"Unggah modul",uploadKey:"Unggah kunci",genKey:"Buat dengan AI",genHint:"Perlu modul terlebih dulu",draft:"Draf AI: tinjau lalu setujui sebelum dipakai",approved:"Disetujui",noKey:"Belum ada kunci jawaban",save:"Simpan",approve:"Setujui",uploadAnswers:"Unggah jawaban (file atau zip)",startCheck:"Mulai koreksi",cancel:"Hentikan",key_missing:"Kunci jawaban belum ada",key_not_approved:"Kunci jawaban belum disetujui",answers_missing:"Jawaban siswa belum ada",student:"Murid",status:"Status",findings:"Temuan",score:"Nilai",open:"Periksa",none:"Belum mengumpulkan",waiting:"Menunggu koreksi",running:"Sedang dikoreksi",review:"Siap ditinjau",error:"Gagal",graded:"Selesai dinilai",pendingN:"belum diputuskan",unmatched:"File belum dikenali",assign:"Pilih murid",export:"Ekspor CSV",humanProof:"Human proof",accept:"Terima",reject:"Tolak",edit:"Ubah",undo:"Batalkan",verified:"Bukti cocok dengan jawaban",unverified:"Perlu dicek: bukti tidak ditemukan",absent:"Perlu dicek: bagian yang dianggap tidak ada",finalGrade:"Penilaian Anda",comment:"Catatan",saveGrade:"Simpan penilaian",gradeLocked:"Putuskan semua temuan dul en:{tagline:"Find mistakes faster. The grade stays with you.",simulation:"Simulation",simText:"Simulation mode: all data is fictional, the AI is simulated, and your real data is untouched. Try Week 1 to review, Week 2 to check, and Week 3 to draft a key with AI.",simReset:"Restart simulation",simulation_off:"Simulation is off",settings:"Settings",classes:"Classes",subjects:"Subjects",newClass:"New class name",newSubject:"New subject name",add:"Add",students:"students",studentList:"Student list",studentHint:"One student per line: number, name",linked:"Classes taking this subject",weeks:"Weeks",addWeek:"Add week",week:"Week",back:"Back",del:"Delete",confirmDel:"Delete? Everything inside goes too.",pickClass:"Class",module:"Module",key:"Answer key",answers:"Student answers",noModule:"No module yet",uploadModule:"Upload module",uploadKey:"Upload key",genKey:"Create with AI",genHint:"Needs a module first",draft:"AI draft: review and approve before use",approved:"Approved",noKey:"No answer key yet",save:"Save",approve:"Approve",uploadAnswers:"Upload answers (files or zip)",startCheck:"Start checking",cancel:"Stop",key_missing:"Answer key is missing",key_not_approved:"Answer key is not approved",answers_missing:"Student answers are missing",student:"Student",status:"Status",findings:"Findings",score:"Grade",open:"Review",none:"Not submitted",waiting:"Waiting",running:"Checking",review:"Ready to review",error:"Failed",graded:"Graded",pendingN:"undecided",unmatched:"Unrecognized files",assign:"Choose student",export:"Export CSV",humanProof:"Human proof",accept:"Accept",reject:"Reject",edit:"Edit",undo:"Undo",verified:"Evidence matches the answer",unverified:"Check this: evidence not found",absent:"Check this: claimed to be absent",finalGrade:"Your assessment",comment:"Note",saveGrade:"Save assessment",gradeLocked:"Decide every finding first",truncated:"Very long answer: the AI checked only the first part.",feedback:"Student feedback",noFindings:"The AI found no mistakes. Please still read the answer.",answer:"Student answer",provider:"AI service",baseUrl:"API URL",model:"Model name",apiKey:"API key",keySaved:"saved; leave empty to keep it",privacy:"Answers go to the chosen AI service after student names and numbers are masked. With Ollama everything stays on this laptop. Check your provider's data policy, especially free tiers.",aiLang:"Findings language",saved:"Saved",uploaded:"matched",unmatchedN:"unrecognized",skipped:"skipped",checking:"Checking",ai_not_configured:"Set up the AI service in Settings first",findings_pending:"Some findings are still undecided",score_required:"Enter a grade first",module_required:"Upload a module first",class_not_linked:"This class does not take the subject",already_running:"Another check is running",unreadable_file:"The file could not be read",name_required:"Name is required",formats:"Formats: text PDF, DOCX, ipynb, text and code. Images and scans cannot be read yet.",noLinked:"No classes yet",noWeeks:"No weeks yet",addClass:"Add class",weekTitle:"Week title (optional)",required:"required",keyHint:"optional, needed to start checking",moduleHint:"optional, needed for an AI-drafted key",answersRequired:"Student answers are required",needClass:"Add a class first",cancelForm:"Cancel"}};
const PRESETS={Gemini:"https://generativelanguage.googleapis.com/v1beta/openai/",OpenAI:"https://api.openai.com/v1",Ollama:"http://localhost:11434/v1"};
let lang="id",view={name:"home"},poll=null,subjectClasses=[];
try{lang=localStorage.getItem("mm-lang")||"id"}catch(e){}
const t=k=>T[lang][k]||k,$=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(m){const e=$("#toast");e.textContent=m;e.style.display="block";clearTimeout(e.h);e.h=setTimeout(()=>e.style.display="none",4000)}
async function api(method,path,body){const r=await fetch(path,{method,headers:{"X-Markmark":"1"},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok){toast(d.message||t(d.error));throw d}return d}
function go(name,args={}){clearInterval(poll);view={name,...args};render()}
async function render(){const sim=await api("GET","/api/simulation");$("#sim").checked=sim.on;$("#simLabel").textContent=t("simulation");$("#simText").textContent=t("simText");$("#simReset").textContent=t("simReset");$("#simBar").hidden=!sim.on;$("#simBar").style.display=sim.on?"flex":"none";$("#tagline").textContent=t("tagline");$("#setBtn").textContent=t("settings");$("#lang").value=lang;document.documentElement.lang=lang;await ({home,cls,subject,week,review,settings})[view.name]()}
$("#sim").onchange=async e=>{try{await api("PUT","/api/simulation",{on:e.target.checked})}finally{go("home")}};
$("#simReset").onclick=async()=>{if(confirm(t("simReset")+"?")){await api("POST","/api/simulation/reset");go("home")}};
$("#lang").onchange=e=>{lang=e.target.value;try{localStorage.setItem("mm-lang",lang)}catch(x){}render()};
async function del(path,next){if(confirm(t("confirmDel"))){await api("DELETE",path);next()}}
async function send(path,file){const buf=new Uint8Array(await file.arrayBuffer());let s="";for(let i=0;i<buf.length;i+=32768)s+=String.fromCharCode.apply(null,buf.subarray(i,i+32768));return api("POST",path,{filename:file.name,data:btoa(s)})}
function picker(fn,multi){const i=document.createElement("input");i.type="file";i.multiple=!!multi;i.onchange=()=>fn([...i.files]);i.click()}

async function home(){const d=await api("GET","/api/tree");
app.innerHTML=`<div class="grid"><section class="panel"><h2>${t("classes")}</h2><ul class="plain">${d.classes.map(c=>`<li><button class="clickable" onclick="go('cls',{id:${c.id}})">${esc(c.name)}</button><span class="muted">${c.students} ${t("students")}</span></li>`).join("")}</ul>
<div class="row" style="margin-top:8px"><input class="grow" id="nc" placeholder="${t("newClass")}" aria-label="${t("newClass")}"><button onclick="addTop('classes','#nc')">${t("add")}</button></div></section>
<section class="panel"><h2>${t("subjects")}</h2><ul class="plain">${d.subjects.map(s=>`<li><button class="clickable" onclick="go('subject',{id:${s.id}})">${esc(s.name)}</button><span class="muted">${s.weeks.length} ${t("weeks").toLowerCase()}</span></li>`).join("")}</ul>
<div class="row" style="margin-top:8px"><input class="grow" id="ns" placeholder="${t("newSubject")}" aria-label="${t("newSubject")}"><button onclick="addTop('subjects','#ns')">${t("add")}</button></div></section></div>`}
async function addTop(k,s){await api("POST","/api/"+k,{name:$(s).value});render()}

async function cls(){const d=await api("GET","/api/tree"),c=d.classes.find(x=>x.id==view.id),list=await api("GET",`/api/classes/${view.id}/students`);
app.innerHTML=`<button onclick="go('home')">${t("back")}</button><section class="panel" style="margin-top:12px"><div class="row"><h2 class="grow">${esc(c.name)}</h2><button onclick="del('/api/classes/${c.id}',()=>go('home'))">${t("del")}</button></div>
<h3>${t("studentList")}</h3><ul class="plain">${list.map(s=>`<li><span>${esc(s.name)} <span class="muted">${esc(s.student_no)}</span></span><button class="link" onclick="del('/api/students/${s.id}',render)">${t("del")}</button></li>`).join("")}</ul>
<label style="margin-top:12px">${t("studentHint")}<textarea id="st"></textarea></label><button class="main" onclick="addStudents()">${t("add")}</button></section>`}
async function addStudents(){await api("POST",`/api/classes/${view.id}/students`,{text:$("#st").value});render()}

async function subject(){const d=await api("GET","/api/tree"),s=d.subjects.find(x=>x.id==view.id),mine=d.classes.filter(c=>s.class_ids.includes(c.id)),rest=d.classes.filter(c=>!s.class_ids.includes(c.id));
app.innerHTML=`<button onclick="go('home')">${t("back")}</button><section class="panel" style="margin-top:12px"><div class="row"><h2 class="grow">${esc(s.name)}</h2><button onclick="del('/api/subjects/${s.id}',()=>go('home'))">${t("del")}</button></div></section>
<div class="grid"><section class="panel"><h3>${t("linked")}</h3><ul class="plain" id="linkedList">${mine.map(c=>`<li><span>${esc(c.name)} <span class="muted">${c.students} ${t("students")}</span></span><button class="link" onclick="setLinks(${JSON.stringify(s.class_ids.filter(i=>i!=c.id))})">${t("del")}</button></li>`).join("")||`<li class="muted">${t("noLinked")}</li>`}</ul>
${rest.length?`<div class="row" style="margin-top:8px"><select class="grow" id="addClass" aria-label="${t("addClass")}">${rest.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select><button id="addClassBtn" onclick="setLinks([...${JSON.stringify(s.class_ids)},+$('#addClass').value])">${t("add")}</button></div>`:""}</section>
<section class="panel"><h3>${t("weeks")}</h3><ul class="plain">${s.weeks.map(w=>`<li><button class="clickable" onclick="go('week',{id:${w.id},sid:${s.id}})">${t("week")} ${w.number}${w.title?" · "+esc(w.title):""}</button><span><button class="link" onclick="renameWeek(${w.id},this.dataset.title)" data-title="${esc(w.title)}">${t("edit")}</button><button class="link" onclick="del('/api/weeks/${w.id}',render)">${t("del")}</button></span></li>`).join("")||`<li class="muted">${t("noWeeks")}</li>`}</ul>
<button class="main" id="newWeek" style="margin-top:8px" onclick="weekForm()">${t("addWeek")}</button></section></div><div id="wf"></div>`;
subjectClasses=mine}
async function setLinks(ids){await api("PUT",`/api/subjects/${view.id}/classes`,{class_ids:ids});render()}
async function renameWeek(id,old){const title=prompt(t("weekTitle"),old||"");if(title!==null){await api("PUT",`/api/weeks/${id}`,{title});render()}}
function weekForm(){const cs=subjectClasses;if(!cs.length){toast(t("needClass"));return}
$("#wf").innerHTML=`<section class="panel"><h3>${t("addWeek")}</h3><label>${t("weekTitle")}<input id="wT"></label>
<label>${t("answers")} (${t("required")})<input type="file" id="wA" multiple></label><label>${t("pickClass")}<select id="wC">${cs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></label>
<label>${t("key")} (${t("keyHint")})<input type="file" id="wK"></label><label>${t("module")} (${t("moduleHint")})<input type="file" id="wM" multiple></label>
<p class="muted">${t("formats")}</p><div class="row"><button class="main" id="wSave" onclick="saveWeek()">${t("save")}</button><button onclick="$('#wf').innerHTML=''">${t("cancelForm")}</button></div></section>`}
async function saveWeek(){const answers=[...$("#wA").files],key=$("#wK").files[0],mods=[...$("#wM").files],cid=+$("#wC").value;if(!answers.length){toast(t("answersRequired"));return}
$("#wSave").disabled=true;const{id}=await api("POST",`/api/subjects/${view.id}/weeks`,{title:$("#wT").value.trim()});
for(const f of mods)await send(`/api/weeks/${id}/modules`,f);if(key)await send(`/api/weeks/${id}/key`,key);for(const f of answers)note(await send(`/api/weeks/${id}/answers?class=${cid}`,f));go("week",{id,sid:view.id,cid})}

async function week(){const tr=await api("GET","/api/tree"),s=tr.subjects.find(x=>x.id==view.sid),cs=tr.classes.filter(c=>s.class_ids.includes(c.id));
const head=`<button onclick="go('subject',{id:${s.id}})">${t("back")}</button>`;
if(!cs.length){app.innerHTML=`${head}<section class="panel" style="margin-top:12px">${t("class_not_linked")}</section>`;return}
if(!cs.some(c=>c.id==view.cid))view.cid=cs[0].id;
const w=await api("GET",`/api/weeks/${view.id}?class=${view.cid}`),job=await api("GET","/api/job"),k=w.key;
app.innerHTML=`${head}<section class="panel" style="margin-top:12px"><div class="row"><h2 class="grow">${esc(w.subject)} · ${t("week")} ${w.number}</h2><label>${t("pickClass")}<select onchange="view.cid=+this.value;render()">${cs.map(c=>`<option value="${c.id}" ${c.id==view.cid?"selected":""}>${esc(c.name)}</option>`).join("")}</select></label></div></section>
<div class="grid"><section class="panel"><h3>${t("module")}</h3><ul class="plain">${w.modules.map(m=>`<li>${esc(m.filename)}<button class="link" onclick="del('/api/modules/${m.id}',render)">${t("del")}</button></li>`).join("")||`<li class="muted">${t("noModule")}</li>`}</ul><button onclick="up('modules')">${t("uploadModule")}</button></section>
<section class="panel"><h3>${t("key")}</h3><p class="${k?k.status=="draft"?"warn":"good":"muted"}">${k?k.status=="draft"?t("draft"):t("approved"):t("noKey")}</p>${k?`<textarea id="kt">${esc(k.text)}</textarea><div class="row" style="margin:8px 0"><button onclick="saveKey(false)">${t("save")}</button>${k.status=="draft"?`<button class="main" onclick="saveKey(true)">${t("approve")}</button>`:""}</div>`:""}
<div class="row"><button onclick="up('key')">${t("uploadKey")}</button><button id="gen" ${w.modules.length?"":"disabled"} title="${w.modules.length?"":t("genHint")}" onclick="genKey()">${t("genKey")}</button></div></section></div>
<section class="panel"><div class="row"><h3 class="grow">${t("answers")}</h3><button onclick="upAnswers()">${t("uploadAnswers")}</button>
<button class="main" id="start" ${w.blockers.length||job.running?"disabled":""} onclick="startCheck()">${t("startCheck")}</button><button id="stop" onclick="api('POST','/api/job/cancel')" ${job.running?"":"hidden"}>${t("cancel")}</button><a href="/api/weeks/${view.id}/export?class=${view.cid}"><button>${t("export")}</button></a></div>
<p class="muted">${t("formats")}</p>${w.blockers.map(b=>`<p class="warn">${t(b)}</p>`).join("")}<p id="job" class="muted"></p>
${w.unmatched.length?`<h3>${t("unmatched")}</h3><ul class="plain">${w.unmatched.map(u=>`<li>${esc(u.filename)}<select style="width:220px" aria-label="${t("assign")}" onchange="assign(${u.id},this.value)"><option value="">${t("assign")}</option>${w.students.map(s=>`<option value="${s.student_id}">${esc(s.name)}</option>`).join("")}</select></li>`).join("")}</ul>`:""}
<table><tr><th>${t("student")}</th><th>${t("status")}</th><th>${t("findings")}</th><th>${t("score")}</th><th></th></tr>${w.students.map(rowOf).join("")}</table></section>`;
if(job.running)watch()}
function rowOf(s){const st=!s.status?t("none"):s.score!=null?t("graded"):t(s.status);return `<tr><td>${esc(s.name)}</td><td class="${s.status=="error"?"bad":""}" title="${esc(s.error)}">${st}</td><td>${s.findings||0}${s.pending?` <span class="warn">(${s.pending} ${t("pendingN")})</span>`:""}</td><td>${esc(s.score)}</td><td>${s.status=="review"?`<button onclick="go('review',{id:${s.submission_id},wid:${view.id},sid:${view.sid},cid:${view.cid}})">${t("open")}</button>`:""}</td></tr>`}
function up(kind){picker(async f=>{for(const x of f)note(await send(`/api/weeks/${view.id}/${kind}`,x));render()},kind=="modules")}
function upAnswers(){picker(async f=>{for(const x of f)note(await send(`/api/weeks/${view.id}/answers?class=${view.cid}`,x));render()},true)}
function note(r){const s=r.skipped?.length?`${r.skipped.length} ${t("skipped")}: ${r.skipped.slice(0,3).map(x=>x.file.split("/").pop()+" ("+x.reason+")").join(", ")}`:"";toast(r.matched!=null?`${r.matched} ${t("uploaded")}, ${r.unmatched} ${t("unmatchedN")}. ${s}`:s||t("saved"))}
async function saveKey(ok){await api("PUT",`/api/weeks/${view.id}/key`,{text:$("#kt").value,approve:ok});render()}
async function genKey(){const b=$("#gen");b.disabled=true;b.textContent="…";try{await api("POST",`/api/weeks/${view.id}/key/generate`)}finally{render()}}
async function assign(u,s){if(s){await api("POST",`/api/unmatched/${u}/assign`,{student_id:+s});render()}}
async function startCheck(){await api("POST",`/api/weeks/${view.id}/check?class=${view.cid}`);render()}
function watch(){clearInterval(poll);poll=setInterval(async()=>{const j=await api("GET","/api/job"),e=$("#job");if(e)e.textContent=`${t("checking")}: ${j.done+j.failed}/${j.total}`;if(!j.running){clearInterval(poll);render()}},1500)}

async function review(){const d=await api("GET",`/api/submissions/${view.id}`),left=d.findings.filter(f=>f.status=="pending").length;
const text=d.files.map(f=>`===== ${f.filename} =====\n${f.text}`).join("\n\n");let html=esc(text);
for(const f of d.findings){if(!f.verified)continue;const p=esc(f.quote).trim().replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/\s+/g,"\\s+");html=html.replace(new RegExp(p,"i"),m=>`<mark id="q${f.id}">${m}</mark>`)}
app.innerHTML=`<button onclick="go('week',{id:${view.wid},sid:${view.sid},cid:${view.cid}})">${t("back")}</button><section class="panel" style="margin-top:12px"><h2>${esc(d.name)}</h2><p class="muted">${esc(d.summary)}</p>${d.truncated?`<p class="warn">${t("truncated")}</p>`:""}</section>
<div class="split"><div><section class="panel"><h3>${t("humanProof")}</h3>${d.findings.map(card).join("")||`<p class="muted">${t("noFindings")}</p>`}</section>
<section class="panel"><h3>${t("finalGrade")}</h3><label>${t("score")}<input id="sc" value="${esc(d.score)}"></label><label>${t("comment")}<textarea id="cm">${esc(d.comment)}</textarea></label><button class="main" ${left?"disabled":""} onclick="saveGrade()">${t("saveGrade")}</button>${left?`<p class="warn">${t("gradeLocked")} (${left})</p>`:""}${d.feedback?`<h3 style="margin-top:12px">${t("feedback")}</h3><pre>${esc(d.feedback)}</pre>`:""}</section></div>
<section class="panel"><h3>${t("answer")}</h3><pre>${html}</pre></section></div>`}
function card(f){const pending=f.status=="pending",ev=f.verified?`<span class="good">${t("verified")}</span>`:`<span class="warn">${t(f.kind=="missing"&&!f.quote?"absent":"unverified")}</span>`;
return `<div class="finding ${pending?"":"done"}"><span class="tag">${esc(f.kind)}</span><span class="tag">${esc(f.section)}</span>${pending?"":`<span class="tag">${t(f.status=="accepted"?"accept":f.status=="rejected"?"reject":"edit")}</span>`}<div id="d${f.id}">${esc(f.description)}</div>
${f.quote?`<div class="muted" ${f.verified?`style="cursor:pointer" onclick="document.getElementById('q${f.id}')?.scrollIntoView({block:'center'})"`:""}>“${esc(f.quote)}”</div>`:""}<div style="font-size:13px">${ev}</div>
<div class="row" style="margin-top:6px">${pending?`<button onclick="decide(${f.id},'accepted')">${t("accept")}</button><button onclick="decide(${f.id},'rejected')">${t("reject")}</button><button onclick="editF(${f.id})">${t("edit")}</button>`:`<button class="link" onclick="decide(${f.id},'pending')">${t("undo")}</button>`}</div></div>`}
async function decide(id,status,description){await api("PUT",`/api/findings/${id}`,{status,description});render()}
function editF(id){const e=$("#d"+id),old=e.textContent;e.innerHTML=`<textarea id="e${id}"></textarea><button onclick="decide(${id},'edited',$('#e${id}').value)">${t("save")}</button>`;$("#e"+id).value=old}
async function saveGrade(){await api("PUT",`/api/submissions/${view.id}/grade`,{score:$("#sc").value,comment:$("#cm").value});toast(t("saved"));render()}

async function settings(){const s=await api("GET","/api/settings");
app.innerHTML=`<button onclick="go('home')">${t("back")}</button><section class="panel" style="margin-top:12px;max-width:560px"><h2>${t("settings")}</h2><label>${t("provider")}<select onchange="if(this.value)$('#bu').value=this.value"><option value="">-</option>${Object.entries(PRESETS).map(([k,v])=>`<option value="${v}">${k}</option>`).join("")}</select></label>
<label>${t("baseUrl")}<input id="bu" value="${esc(s.base_url)}"></label><label>${t("model")}<input id="md" value="${esc(s.model)}"></label><label>${t("apiKey")}${s.has_key?` (${t("keySaved")})`:""}<input id="ak" type="password" autocomplete="off"></label>
<label>${t("aiLang")}<select id="al"><option value="id" ${s.language=="id"?"selected":""}>Bahasa Indonesia</option><option value="en" ${s.language=="en"?"selected":""}>English</option></select></label><p class="muted">${t("privacy")}</p><button class="main" onclick="saveSet()">${t("save")}</button></section>`}
async function saveSet(){await api("PUT","/api/settings",{base_url:$("#bu").value,model:$("#md").value,api_key:$("#ak").value,language:$("#al").value});toast(t("saved"));render()}
render();
</script>
</body>
</html>
