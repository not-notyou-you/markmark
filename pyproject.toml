[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "markmark"
version = "0.1.0"
description = "Find mistakes in student answers faster. Every mark has a citation; the grade stays with the human grader."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pypdf>=4", "keyring>=24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
markmark = "markmark.__main__:main"

[tool.setuptools]
packages = ["markmark"]

[tool.setuptools.package-data]
markmark = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
