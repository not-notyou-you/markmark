<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo Check dan M</title>
<style>
:root{--bg:#f4f1e9;--card:#fffdf8;--ink:#1f1d1a;--mute:#69645a;--red:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#191816;--card:#23211e;--ink:#efeade;--mute:#aaa497;--red:#f0837a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:1160px;margin:0 auto;padding:40px 24px}h1{font:700 38px Georgia,serif;margin:0}main>p{color:var(--mute);max-width:640px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;margin-top:28px}
article{background:var(--card);border-radius:12px;padding:20px}
.big{height:150px;display:flex;align-items:center;justify-content:center}.big svg{width:112px;height:112px}
.lock{display:flex;align-items:center;gap:10px;font:700 24px Georgia,serif;margin:10px 0 14px}.lock svg{width:34px;height:34px}
.tests{display:flex;gap:8px;align-items:center}.tile{width:58px;height:58px;border-radius:9px;display:grid;place-items:center}.tile svg{width:36px;height:36px}
.light{background:#fff;color:#1f1d1a}.dark{background:#1f1d1a;color:#fff}.tiny svg{width:16px;height:16px;display:block}.tiny{margin-left:6px}
h2{font-size:17px;margin:14px 0 2px}article p{margin:0;color:var(--mute);font-size:15px}.pick{color:var(--red);font-weight:600;font-size:13px}
</style>
</head>
<body><main><h1>Logo kombinasi check dan M</h1>
<p>Enam arah untuk menyatukan huruf M dan tanda centang.</p>
<div class="grid" id="g"></div></main>
<script>
const R="#b3261e",S='fill="none" stroke-linecap="round" stroke-linejoin="round"',L=[
["Kaki Centang","Kaki kanan M naik memanjang menjadi centang.",`<path d="M8 50V16l18 22 8-10" ${S} stroke="currentColor" stroke-width="8"/><path d="M26 38l8 10L58 10" ${S} stroke="${R}" stroke-width="8"/>`,1],
["M Terpotong Centang","Huruf M utuh dengan lembah berupa centang merah.",`<path d="M10 52V12l12 14M54 52V12L42 26" ${S} stroke="currentColor" stroke-width="8"/><path d="M20 28l12 16 12-18" ${S} stroke="${R}" stroke-width="8"/>`],
["Satu Garis","M dan centang digambar satu tarikan pena.",`<path d="M6 50V18l14 18 10-14 8 14L58 10" ${S} stroke="${R}" stroke-width="8"/>`],
["Lencana","M putih di dalam kotak, centang sebagai lembahnya.",`<rect x="4" y="4" width="56" height="56" rx="13" fill="${R}"/><path d="M16 46V18l16 20 16-20v28" ${S} stroke="#fff" stroke-width="7"/>`],
["Centang Sudut","M tegas dengan lencana centang di sudut kanan atas.",`<path d="M8 54V18l18 22 18-22v36" ${S} stroke="currentColor" stroke-width="8"/><circle cx="50" cy="14" r="12" fill="${R}"/><path d="M44 14l5 5 8-9" ${S} stroke="#fff" stroke-width="4"/>`],
["Stempel Check-M","Lingkaran stempel berisi M yang berakhir centang.",`<circle cx="32" cy="32" r="28" fill="none" stroke="${R}" stroke-width="5"/><path d="M16 44V22l11 14 7-8 5 8 11-16" ${S} stroke="${R}" stroke-width="6"/>`]];
const s=b=>`<svg viewBox="0 0 64 64" aria-hidden="true">${b}</svg>`;
g.innerHTML=L.map(([n,d,b,p],i)=>`<article><div class="big">${s(b)}</div><div class="lock">${s(b)}Markmark</div><div class="tests"><div class="tile light">${s(b)}</div><div class="tile dark">${s(b.replaceAll(R,"#f0837a"))}</div><div class="tiny">${s(b)}</div></div><h2>${i+1}. ${n}</h2><p>${d}</p>${p?'<span class="pick">Rekomendasi</span>':""}</article>`).join("");
</script>
</body></html>
